[project]
name = "mazebot-sim"
version = "0.1.0"
description = "2D simulator for a maze robot: system identification, firmware in the loop, tuning and learning"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Later milestones; milestone 1 runs on the standard library alone.
viz = ["matplotlib"]
tune = ["optuna"]
rl = ["gymnasium", "stable-baselines3"]

[dependency-groups]
dev = [
    "coverage>=7.17.4",
    "ruff>=0.17.6",
]

[tool.coverage.run]
source = ["mazesim"]
